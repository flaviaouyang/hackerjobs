# Technology names used to clean up and find technologies in posts.
#
# [aliases]: canonical name = other spellings (matched case-insensitively).
# concepts: generic terms that are not named technologies; always dropped.
# ambiguous: canonical names that are also common words; never found by scanning post text,
#            only kept when a model or a "Technologies:" line lists them.
# unscannable: aliases that are common words; they map to a canonical name inside technology
#              lists but are not searched for in post text.

concepts = [
    "a2a", "agentic ai", "agentic systems", "agents", "ai", "ai agents", "api", "api integration", "apis",
    "backend", "big data", "cd", "ci", "ci/cd", "cloud", "cloud architecture", "data engineering",
    "data entry", "data pipelines", "deep learning", "devops", "distributed systems", "elt", "embeddings",
    "etl", "frontend", "full stack", "fullstack", "genai", "generative ai", "http", "infrastructure", "llm",
    "llm agents", "llm evals", "llms", "machine learning", "mcp", "microservices", "ml", "mlops", "mobile",
    "nlp", "rag", "rag pipelines", "rest", "rest apis", "restful apis", "rpc", "serverless", "socks5", "ssh",
    "tcp/ip", "tdd", "testing", "vector databases", "vector db", "vector search", "web", "web research",
    "webrtc", "websockets",
]

ambiguous = [
    "Ant", "Apollo", "Base", "Beam", "Bun", "C", "Chef", "Combine", "Compose", "Consul", "Crystal", "Cursor",
    "Dart", "Echo", "Expo", "Express", "Fiber", "Foundry", "Gemini", "Gin", "Glue", "Go", "Helm", "Hilt", "Hive", "Julia",
    "Lit", "Neon", "Nomad", "Packer", "Phoenix", "Presto", "R", "Railway", "Ray", "Relay", "Remix", "Render",
    "Rocket", "Room", "Spring Boot", "Stripe", "Swift", "Triton", "Turbo", "Unity", "Vault", "Windows",
]

