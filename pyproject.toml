[project]
name = "hackerjobs"
version = "0.1.0"
description = "Job board for Hacker News' monthly Who is hiring / Who wants to be hired threads"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28",
    "nh3>=0.2",
    "pydantic>=2.10",
]

[project.scripts]
hackerjobs = "hackerjobs.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["tests"]
