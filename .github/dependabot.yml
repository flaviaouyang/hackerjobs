# Weekly update pull requests, grouped per ecosystem; CI checks each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: bun
    directory: /web
    schedule: { interval: weekly }
    groups: { site: { patterns: ["*"] } }
    ignore:
      # astro check does not support TypeScript 7 yet; remove once it does.
      - dependency-name: typescript
        versions: [">=7"]
